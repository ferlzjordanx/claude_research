# Voluntary disruptions (node drains, cluster upgrades) may evict
# pods only while at least one stays available.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-api
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-api
