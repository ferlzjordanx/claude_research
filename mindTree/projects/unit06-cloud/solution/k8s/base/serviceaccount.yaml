apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-api
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-api
  annotations:
    # [Provider-specific] IRSA: pods using this ServiceAccount get
    # temporary credentials for this IAM role (no access keys).
    # With EKS Pod Identity, drop the annotation and create a pod
    # identity association for the role instead.
    eks.amazonaws.com/role-arn: >-
      arn:aws:iam::111122223333:role/inventory-api-REPLACE-ME
