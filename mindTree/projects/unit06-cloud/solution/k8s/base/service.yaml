apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-api
spec:
  type: ClusterIP        # internal; the Ingress exposes it
  selector:
    app.kubernetes.io/name: inventory-api
  ports:
    - name: http
      port: 80
      targetPort: http   # the container port *name*
