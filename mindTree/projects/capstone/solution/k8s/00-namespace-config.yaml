apiVersion: v1
kind: Namespace
metadata:
  name: support
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: support-api-config
  namespace: support
data:
  APP_ENV: prod
  APP_LOG_JSON: "true"
  APP_CREATE_SCHEMA: "false"
  APP_LLM_PROVIDER: anthropic
  APP_CORS_ORIGINS: '["https://support.example.com"]'
# Secrets (APP_JWT_SECRET, APP_DATABASE_URL, APP_ANTHROPIC_API_KEY)
# come from AWS Secrets Manager via External Secrets Operator into a
# Secret named support-api-secrets. Never commit real values.
