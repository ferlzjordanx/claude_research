# CI on every PR; CI + CD (staging -> approval -> production) on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# TODO(5): add a top-level `permissions:` block that grants only
# `contents: read`, and a `concurrency:` block grouped by workflow
# and ref that cancels stale PR runs but never cancels main runs.

env:
  PYTHON_VERSION: "3.13"
  # Push and deploy only for commits that landed on main.
  IS_MAIN: >-
    ${{ github.event_name == 'push'
        && github.ref == 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false # see every failing version, not just the first
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: >-
          pytest -q
          --junitxml=reports/junit-${{ matrix.python-version }}.xml
      - name: Upload test report
        if: always() # the report matters most when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: reports/
          retention-days: 14

  build:
    # TODO(6): run only after lint, typecheck and test pass (`needs`),
    # and give this job `contents: read` plus the `id-token: write`
    # permission that configure-aws-credentials needs for OIDC.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      IMAGE: >-
        ${{ vars.ECR_REGISTRY || 'local' }}/pricing-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags for the version step
      - name: Compute version from Conventional Commits
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' \
            2>/dev/null || echo v0.0.0)
          range="$last..HEAD"
          [ "$last" = v0.0.0 ] && range=HEAD
          next=$(git log --format=%B%x00 "$range" \
            | python3 -m scripts.next_version "$last")
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image (tagged with the git sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true # keep it local so we can scan before pushing
          tags: ${{ env.IMAGE }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Configure AWS credentials (OIDC)
        if: env.IS_MAIN == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        if: env.IS_MAIN == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push and record the immutable digest
        id: push
        if: env.IS_MAIN == 'true'
        run: |
          docker push "$IMAGE"
          digest=$(docker inspect \
            --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $digest" >> "$GITHUB_STEP_SUMMARY"

  # TODO(7): deploy-staging job
  #  - needs build; runs only for a push to refs/heads/main
  #  - environment: staging (url: vars.STAGING_URL)
  #  - permissions: contents read + id-token write; timeout-minutes
  #  - env IMAGE: ${{ needs.build.outputs.image }}
  #  - steps: checkout, setup-python, pip install httpx,
  #    configure-aws-credentials (vars.AWS_DEPLOY_ROLE_ARN),
  #    aws eks update-kubeconfig, kubectl set image + rollout status,
  #    python -m scripts.smoke_test --base-url ... --expected-sha ...
  #  - a final step with `if: failure()` that runs
  #    kubectl rollout undo deployment/pricing-api

  # TODO(8): deploy-production job
  #  - same shape as staging, but needs [build, deploy-staging]
  #  - environment: production (required reviewers are configured
  #    on the environment in the repository settings)
  #  - deploys the SAME image digest: promote, never rebuild
