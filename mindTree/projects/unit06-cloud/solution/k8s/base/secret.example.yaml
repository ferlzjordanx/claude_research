# EXAMPLE ONLY: placeholder values, safe to commit. Kubernetes
# Secrets are base64-encoded, not encrypted. In production, sync the
# value from AWS Secrets Manager with External Secrets Operator or
# the Secrets Store CSI driver, and enable KMS envelope encryption.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-api
type: Opaque
stringData:
  APP_DATABASE_URL: >-
    postgresql+psycopg://inventory:REPLACE-ME@db.internal:5432/inventory
